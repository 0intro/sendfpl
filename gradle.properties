org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# The iOS targets' Kotlin compiles to klibs on Linux too, so their code is checked here. Only
# linking a framework and running its tests need a Mac.
kotlin.native.enableKlibsCrossCompilation=true
# The release, one for the Android app and the iPhone app, whose build reads these lines too.
# versionCode only goes up: Play never takes one twice.
sendfpl.versionName=0.3.0
sendfpl.versionCode=8
