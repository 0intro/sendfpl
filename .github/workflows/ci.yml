name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One run per ref, the newest: an older run would only report on a commit the branch has moved
# past. A pull request cancels only its own earlier run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # A public repository turns "committed by reflex" into a disclosure that cannot be taken back.
      - name: no secrets are tracked
        run: |
          # Keystores and the Connext credential, and also the Play service account key and the
          # App Store Connect API key and provisioning profiles, which are a different kind of
          # secret with the same consequence: they can upload to a store.
          hits=$(git ls-files | grep -iE 'creds\.json|credential[^/]*\.json$|\.jks$|\.keystore$|keystore\.properties|local\.properties|\.p12$|\.pem$|service.?account|play.?credentials|\.mobileprovision$|\.p8$|AuthKey_' || true)
          test -z "$hits" || { echo "tracked files that look like secrets:"; echo "$hits"; exit 1; }
      # The wrapper jar is a binary a pull request can quietly replace. This checks it against every
      # wrapper checksum Gradle has published, so a version bump needs no edit here.
      - uses: gradle/actions/wrapper-validation@v6

  build:
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # Sign every CI build with one key, so a download installs over the last one instead of
      # forcing an uninstall, which would take the credential stored on the handset with it. The
      # test is in the script rather than in `if:` because the secrets context is not available to
      # a step condition. Absent the secret, on a fork's pull request, AGP generates its own key
      # and the build still works.
      - name: stable debug signing key
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_B64" ]; then
            mkdir -p local
            printf '%s' "$DEBUG_KEYSTORE_B64" | base64 -d > local/debug.keystore
            echo "signing with the stable debug key"
          else
            echo "no DEBUG_KEYSTORE_B64: AGP will generate an ephemeral debug key, and this build"
            echo "will not install over any other"
          fi

      # There is no creds.json and no keystore.properties on this runner, and that is the point:
      # this job is what keeps proving a fresh clone builds.
      - run: ./gradlew :cxp:allTests
      - run: ./gradlew :ui:testAndroidHostTest
      # The iPhone app's Kotlin compiles here too: only linking it and running it need a Mac, which
      # the ios job has.
      - run: ./gradlew :ui:compileKotlinIosArm64 :ui:compileTestKotlinIosSimulatorArm64
      - run: ./gradlew :app:testDebugUnitTest
      - run: ./gradlew :app:assembleDebug
      - run: ./gradlew :app:lintDebug :ui:lintAndroidMain

      # The store listing is tracked, so it is checked like anything else that is. Play reads its
      # metadata only after it has read the credentials, so an over-long description otherwise
      # fails a publish that has already authenticated.
      - run: ./gradlew :app:verifyPlayListing

      # The flag stages the release without a credential, so this proves a clone builds. Play's
      # upload tasks check the credential themselves, so nothing built this way can go up.
      - run: ./gradlew :app:assembleRelease -Psendfpl.allowMissingCredential=true

      # R8 is what keeps the APK small, and nothing else notices if a stray
      # isMinifyEnabled = false undoes it, so the size is asserted. The ceiling is a tripwire for
      # minification having stopped, not a budget: an unminified build is several times larger.
      - name: the release apk is minified
        run: |
          # Found rather than named: without keystore.properties the release APK is unsigned, and
          # AGP names it app-release-unsigned.apk.
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*.apk)
          test "${#apks[@]}" -eq 1 || {
            echo "expected one release apk, found ${#apks[@]}: ${apks[*]}"; exit 1; }
          bytes=$(stat -c%s "${apks[0]}")
          echo "${apks[0]} is $((bytes / 1024)) kB"
          test "$bytes" -lt 4194304 || {
            echo "over the 4 MB ceiling, so R8 is probably not running"; exit 1; }

      - name: the debug apk carries no credential
        run: |
          hits=$(unzip -l app/build/outputs/apk/debug/app-debug.apk | grep creds.json || true)
          test -z "$hits" || { echo "debug APK carries a credential"; exit 1; }

      # Installable, and upgradable over the previous one. It authenticates to nothing until you
      # import a credential in the app.
      - uses: actions/upload-artifact@v7
        with:
          name: sendfpl-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports-${{ github.sha }}
          path: |
            app/build/reports/
            cxp/build/reports/
            ui/build/reports/
          retention-days: 30
          if-no-files-found: ignore

  # The release, with the credential from the SENDFPL_CREDENTIAL_B64 secret: the APK, and the
  # bundle Play takes. Each is checked to carry the secret's bytes and then discarded, since an
  # artifact of a public repository is public. GitHub withholds secrets from a pull request opened
  # from a fork, which this job skips.
  release:
    needs: build
    if: ${{ !github.event.pull_request.head.repo.fork }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # The credential, in a file only the runner's user reads. GitHub masks the secret as it
      # stores it, in base64, so the token and the entitlement are masked here once decoded.
      - name: credential
        env:
          SENDFPL_CREDENTIAL_B64: ${{ secrets.SENDFPL_CREDENTIAL_B64 }}
        run: |
          test -n "$SENDFPL_CREDENTIAL_B64" || { echo "no SENDFPL_CREDENTIAL_B64 secret"; exit 1; }
          (umask 077 && printf '%s' "$SENDFPL_CREDENTIAL_B64" | base64 -d > "$RUNNER_TEMP/creds.json")
          jq -r '(.token, .entitlement) | strings' "$RUNNER_TEMP/creds.json" |
            sed 's/^/::add-mask::/' || { echo "SENDFPL_CREDENTIAL_B64 holds no JSON credential"; exit 1; }

      # Without the build cache: compressReleaseAssets is cacheable, so its entry would carry the
      # credential into the Gradle cache that setup-java saves, and a fork's pull request can
      # restore that cache.
      - run: |
          ./gradlew --no-build-cache :app:assembleRelease :app:bundleRelease \
            -Psendfpl.credential="$RUNNER_TEMP/creds.json"

      # GitHub keeps a secret write-only, so the summary names the credential by its SHA-256, which
      # sha256sum creds.json reproduces.
      - name: the release carries the credential
        run: |
          cred=$RUNNER_TEMP/creds.json
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*.apk)
          test "${#apks[@]}" -eq 1 || {
            echo "expected one release apk, found ${#apks[@]}: ${apks[*]}"; exit 1; }
          aab=app/build/outputs/bundle/release/app-release.aab
          unzip -p "${apks[0]}" assets/creds.json | cmp -s - "$cred" || {
            echo "${apks[0]} carries no credential, or another one"; exit 1; }
          unzip -p "$aab" base/assets/creds.json | cmp -s - "$cred" || {
            echo "$aab carries no credential, or another one"; exit 1; }
          echo "The release carries the credential whose SHA-256 is $(sha256sum < "$cred" | cut -d' ' -f1)." \
            >> "$GITHUB_STEP_SUMMARY"

  # The iPhone and iPad app: the shared code's tests on a simulator, the UI test on an iPhone and on
  # an iPad in both languages with a screenshot of every screen and of every failure, and the archive
  # that ships, unsigned, with the credential. A run has taken from a quarter of an hour to over an
  # hour, as runners vary, so it waits for the Linux build, has two hours, and keeps the test results
  # of a failed run alone.
  ios:
    needs: build
    runs-on: macos-26
    timeout-minutes: 120
    env:
      XCODEGEN_VERSION: 2.46.0
      XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # The newest Xcode 26 on the image, named in the log, so a run says what it built with.
      - name: Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      # Kotlin/Native's compiler and its dependencies, a download of several hundred megabytes.
      - uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}

      # Every failure in one run, since a macOS run is dear: --continue runs both test tasks, and
      # the steps below run after a failed one, while the job still fails.
      - name: the shared code's tests, on the simulator
        run: ./gradlew --console=plain --continue :cxp:iosSimulatorArm64Test :ui:iosSimulatorArm64Test

      - name: the Xcode project, from ios/project.yml
        if: ${{ !cancelled() }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          echo "$XCODEGEN_SHA256  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/xcodegen/bin/xcodegen" generate --spec ios/project.yml

      # The newest iOS this Xcode simulates, and the newest iPhone and iPad that runtime supports.
      - name: simulators
        if: ${{ !cancelled() }}
        run: |
          runtime=$(xcrun simctl list runtimes -j |
            jq -c '[.runtimes[] | select(.platform == "iOS" and .isAvailable)] | last')
          rid=$(jq -r .identifier <<<"$runtime")
          for family in iPhone iPad; do
            type=$(jq -r --arg f "$family" \
              '[.supportedDeviceTypes[] | select(.productFamily == $f)] | last | .identifier' <<<"$runtime")
            id=$(xcrun simctl create "sendfpl-$family" "$type" "$rid")
            echo "$family: $type on $rid, $id"
            echo "SIM_$(echo "$family" | tr a-z A-Z)=$id" >> "$GITHUB_ENV"
          done

      # A device runs only for its own test, since each booted one takes memory: the archive took
      # 33 minutes with two booted, and 6 once they were shut down.
      - name: UI tests, iPhone and iPad
        if: ${{ !cancelled() }}
        run: |
          xcrun simctl shutdown all || true
          mkdir -p screenshots results
          version=$(sed -n 's/^sendfpl\.versionName=//p' gradle.properties)
          # Both devices, whichever fails first, so one run says how each fares.
          status=0
          for sim in "$SIM_IPHONE" "$SIM_IPAD"; do
            if [ "$sim" = "$SIM_IPHONE" ]; then device=iphone; else device=ipad; fi
            xcrun simctl bootstatus "$sim" -b >/dev/null
            # xcodebuild finds a simulator through CoreSimulator, which can list none for minutes
            # after a slow boot: wait until this one is a destination, then test either way.
            tries=0
            until xcodebuild -showdestinations -project ios/SendFPL.xcodeproj -scheme SendFPL \
              2>/dev/null | grep -qF "id:$sim"; do
              tries=$((tries + 1))
              if [ "$tries" -ge 30 ]; then
                echo "$device: xcodebuild still lists no simulator $sim"
                break
              fi
              sleep 10
            done
            TEST_RUNNER_SCREENSHOTS="$PWD/screenshots" TEST_RUNNER_VERSION="$version" xcodebuild test \
              -project ios/SendFPL.xcodeproj -scheme SendFPL -destination "id=$sim" \
              -derivedDataPath build/test -resultBundlePath "results/$sim.xcresult" \
              CODE_SIGNING_ALLOWED=NO || status=1
            # A pick hands the app a copy of each file, which the app deletes once it is read.
            data=$(xcrun simctl get_app_container "$sim" app.sendfpl data 2>/dev/null || true)
            if [ -n "$data" ]; then
              kept=$(find "$data" -type f \( -name 'chateaux*' -o -name 'not-a-credential*' \) -print)
              if [ -n "$kept" ]; then
                printf '%s: the app kept copies of the files it was handed:\n%s\n' "$device" "$kept"
                status=1
              fi
              # The navigator in memory lasts for the launch: the navigators file holds real ones alone.
              memory="$data/Library/Application Support/navigators/navigators.txt"
              if [ -f "$memory" ] && awk -F'\t' '$2 == "DEMO" { found = 1 } END { exit !found }' "$memory"; then
                printf '%s: the app wrote the navigator in memory to %s\n' "$device" "$memory"
                status=1
              fi
            fi
            xcrun simctl shutdown "$sim" || true
          done
          exit "$status"

      # The credential, for the archive alone: the app adopts one it carries into the keychain, which
      # the UI test expects empty. A pull request from a fork gets no secret and stops at the UI
      # test. GitHub masks the secret as it stores it, in base64, so the token and the entitlement
      # are masked here once decoded.
      - name: credential
        id: credential
        if: ${{ !cancelled() && !github.event.pull_request.head.repo.fork }}
        env:
          SENDFPL_CREDENTIAL_B64: ${{ secrets.SENDFPL_CREDENTIAL_B64 }}
        run: |
          test -n "$SENDFPL_CREDENTIAL_B64" || { echo "no SENDFPL_CREDENTIAL_B64 secret"; exit 1; }
          (umask 077 && printf '%s' "$SENDFPL_CREDENTIAL_B64" | base64 -d > "$RUNNER_TEMP/creds.json")
          jq -r '(.token, .entitlement) | strings' "$RUNNER_TEMP/creds.json" |
            sed 's/^/::add-mask::/' || { echo "SENDFPL_CREDENTIAL_B64 holds no JSON credential"; exit 1; }

      # What ships, unsigned: the archive ios-release.yml signs, with the credential. It is checked
      # and then discarded, since an artifact of a public repository is public. The simulators are
      # shut down first, which leaves their memory to the Kotlin/Native link of the release
      # framework.
      - name: unsigned archive
        if: ${{ !cancelled() && steps.credential.outcome == 'success' }}
        run: |
          xcrun simctl shutdown all || true
          SENDFPL_CREDENTIAL=$RUNNER_TEMP/creds.json xcodebuild archive -project ios/SendFPL.xcodeproj \
            -scheme SendFPL -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/SendFPL.xcarchive CODE_SIGNING_ALLOWED=NO
          app=build/SendFPL.xcarchive/Products/Applications/SendFPL.app
          plist() { /usr/libexec/PlistBuddy -c "Print :$1" "$app/Info.plist"; }
          test "$(plist UISupportedExternalAccessoryProtocols:0)" = com.garmin.connext
          test "$(plist CFBundleShortVersionString)" = "$(sed -n 's/^sendfpl\.versionName=//p' gradle.properties)"
          cmp -s "$app/creds.json" "$RUNNER_TEMP/creds.json" || {
            echo "the archive carries no credential, or another one"; exit 1; }
          lipo -archs "$app/SendFPL" | grep -qw arm64
          # App Store Connect refuses an upload whose executable calls a required reason API its
          # privacy manifest leaves out: each category found is listed, and each must be declared.
          nm -u "$app/SendFPL" | sed 's/^_//' > "$RUNNER_TEMP/imports.txt"
          status=0
          while read -r category symbols; do
            found=$(grep -xE "$symbols" "$RUNNER_TEMP/imports.txt" | tr '\n' ' ' || true)
            [ -n "$found" ] || continue
            echo "$category: $found"
            grep -q "NSPrivacyAccessedAPICategory$category" "$app/PrivacyInfo.xcprivacy" ||
              { echo "PrivacyInfo.xcprivacy lacks $category"; status=1; }
          done <<'EOF'
          FileTimestamp stat|fstat|fstatat|lstat|getattrlist|getattrlistbulk|fgetattrlist|getattrlistat
          SystemBootTime mach_absolute_time
          DiskSpace statfs|statvfs|fstatfs|fstatvfs
          UserDefaults OBJC_CLASS_\$_NSUserDefaults
          EOF
          test "$status" = 0

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-${{ github.sha }}
          path: screenshots/
          retention-days: 30
          if-no-files-found: ignore

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-results-${{ github.sha }}
          path: |
            results/
            cxp/build/reports/
            ui/build/reports/
          retention-days: 30
          if-no-files-found: ignore
